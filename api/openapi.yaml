openapi: 3.1.0

info:
  title: CarLog API
  version: 0.1.0
  description: HTTP API личного журнала обслуживания автомобиля.
  license:
    name: MIT
    identifier: MIT

security: []

servers:
  - url: http://localhost:8080
    description: Локальное окружение

tags:
  - name: System
    description: Состояние приложения и его зависимостей.
  - name: Cars
    description: Автомобили пользователя.

paths:
  /ping:
    $ref: "./system.yaml#/paths/~1ping"
  /health:
    $ref: "./system.yaml#/paths/~1health"
  /cars:
    $ref: "./cars.yaml#/paths/~1cars"

components:
  schemas:
    ErrorResponse:
      $ref: "./common.yaml#/components/schemas/ErrorResponse"
    PingResponse:
      $ref: "./system.yaml#/components/schemas/PingResponse"
    HealthResponse:
      $ref: "./system.yaml#/components/schemas/HealthResponse"
    CreateCarRequest:
      $ref: "./cars.yaml#/components/schemas/CreateCarRequest"
    Car:
      $ref: "./cars.yaml#/components/schemas/Car"
