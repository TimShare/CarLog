services:
  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://carlog:carlog@postgres:5432/carlog?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carlog
      POSTGRES_USER: carlog
      POSTGRES_PASSWORD: carlog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carlog -d carlog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
